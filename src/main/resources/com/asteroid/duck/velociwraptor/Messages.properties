## Main options
quiet=Disable interactive mode
output=Target directory for template output
properties=Use system properties to resolve template variables
env=Use system ENVIRONMENT to resolve template variables
repo=URI to maven or github repo when using those template sources
zip-root=path to template root inside ZIP/JAR
retain=Retain any cached downloads of ZIP/JAR files
no-color=No color in console

## Template options section
template=Select one of the following mechanisms for locating a template package to use%n
dir=Load a template from a local filesystem folder.%nDIR is a path to a directory in the filesystem
git=Load a template from a GitHub repository.%nCOORD is defined as {user}/{repo}/{branch}%n(branch optional). See [1]
mvn=Load a template from a Maven artifact.%nFor COORD use a maven ':' separated coordinate syntax%nsee [1], [2]
zip=Load a template from a ZIP file (any URI)
